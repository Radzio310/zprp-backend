<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07080c">
<title>Egzamin na żywo - rzutnik</title>
<link rel="stylesheet" href="/exam-live/assets/live.css">
<style>
/* Rzutnik: scena 16:9 wpisana w każdy ekran (jak Communio). Wszystko w jednostkach cqh/cqw sceny,
   więc rzutnik 1024x768, 1920x1080 i ultrawide pokazują ten sam kadr; nic nie wychodzi poza scenę. */
html, body { overflow: hidden; background: var(--bg); }
#stage { position: absolute; left: 50%; top: 50%; width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); transform: translate(-50%, -50%);
  container-type: size; z-index: 1; font-size: 2.4cqh; }
.scene { position: absolute; inset: 0; opacity: 0; transform: translate3d(0, 1.6cqh, 0) scale(.992);
  transition: opacity .8s var(--out), transform 1s var(--out); }
.scene.on { opacity: 1; transform: none; }
.scene.out { opacity: 0; transform: translate3d(0, -1.4cqh, 0) scale(.996); transition-duration: .55s; }

/* Pasek marki u góry każdej sceny */
.brandbar { position: absolute; left: 5cqw; right: 5cqw; top: 4.4cqh; display: flex; align-items: center; gap: 1.8cqh; min-width: 0; }
.brandbar .crest { width: 6.4cqh; height: 6.4cqh; }
.brandbar .who { display: flex; flex-direction: column; gap: .7cqh; min-width: 0; flex: 1; }
.brandbar .eyebrow { font-size: 1.55cqh; }
.brandbar .ttl { font: 700 2.5cqh/1.1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: .8cqh; padding: .75cqh 1.6cqh; border-radius: 99cqh; border: 1px solid var(--hair);
  background: var(--glass); font: 700 1.6cqh/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); white-space: nowrap; }
.pill b { color: var(--ink); letter-spacing: .2em; font-family: var(--display); font-size: 2.1cqh; }

/* ---------- Lobby ---------- */
.lobby .left { position: absolute; left: 5cqw; top: 16cqh; width: 92cqh; bottom: 6cqh; display: flex; flex-direction: column; }
.lobby h1 { margin: 0; font: 700 7cqh/1.04 var(--display); letter-spacing: -.01em; max-height: 15.5cqh; overflow: hidden; }
.lobby .lead { margin: 2.4cqh 0 0; font: 400 2.3cqh/1.35 var(--sans); color: var(--ink2); }
.pinrow { display: flex; align-items: flex-end; gap: 1.1cqh; margin-top: 3.4cqh; }
.pinrow .lab { writing-mode: vertical-rl; transform: rotate(180deg); font: 800 1.45cqh/1 var(--sans); letter-spacing: .34em; color: var(--ink2); margin-right: .6cqh; }
.pinrow .digit { --r: 1.3cqh; width: 9.6cqh; height: 12.6cqh; display: flex; align-items: center; justify-content: center;
  font: 700 8.6cqh/1 var(--display); box-shadow: none; animation: digitIn .7s var(--spring) both; animation-delay: var(--d); }
.pinrow .digit.tick { animation: digitTick .6s var(--out) both; }
.pinrow .sep { width: 2cqh; }
@keyframes digitIn { from { opacity: 0; transform: translate3d(0, 5cqh, 0) rotate(-6deg); } to { opacity: 1; transform: none; } }
@keyframes digitTick { 0%, 100% { transform: none; } 40% { transform: translate3d(0, -1.1cqh, 0) rotate(-2deg); } }
.linkline { margin-top: 2.8cqh; display: flex; align-items: baseline; gap: 1.2cqh; min-width: 0; }
.linkline .or { font: 600 1.9cqh/1 var(--sans); color: var(--ink2); flex: none; }
.linkline .box { flex: 1; min-width: 0; overflow: hidden; }
.linkline .url { display: inline-block; font: 700 3cqh/1.1 var(--sans); color: var(--ink); letter-spacing: .01em; }
.linkline .url em { font-style: normal; color: color-mix(in srgb, var(--p1) 65%, var(--ink)); }
.crowd { margin-top: auto; display: flex; flex-direction: column; gap: 1.6cqh; min-height: 0; }
.crowd .count { display: flex; align-items: baseline; gap: 1.4cqh; }
.crowd .count b { font: 700 9cqh/0.9 var(--display); }
.crowd .count span { font: 600 2.2cqh/1.2 var(--sans); color: var(--ink2); }
.chips { display: flex; flex-wrap: wrap; gap: 1cqh; max-height: 14.4cqh; overflow: hidden; align-content: flex-start; }
.chip { --r: .7cqh; display: inline-flex; align-items: center; gap: .8cqh; padding: .9cqh 1.5cqh; font: 650 1.95cqh/1 var(--sans); max-width: 34cqh;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: chipIn .7s var(--spring) both; animation-delay: var(--d, 0s); }
.chip.user { background: var(--paper); color: var(--paper-ink); }
.chip.guest { background: transparent; color: var(--ink); border: 1px dashed var(--hair); -webkit-mask: none; mask: none; border-radius: .7cqh; }
.chip.more { background: var(--glass2); color: var(--ink); -webkit-mask: none; mask: none; border-radius: 99cqh; }
.chip.ghost { background: var(--glass); width: 16cqh; -webkit-mask: none; mask: none; border-radius: .7cqh; animation: ghost 2.4s ease-in-out infinite; animation-delay: var(--d); }
@keyframes chipIn { from { opacity: 0; transform: translate3d(0, 3cqh, 0) rotate(5deg) scale(.8); } to { opacity: 1; transform: none; } }
@keyframes ghost { 0%, 100% { opacity: .35; } 50% { opacity: .8; } }
.qrcard { position: absolute; right: 5cqw; top: 13cqh; width: 64cqh; bottom: 6cqh; display: flex; flex-direction: column; align-items: stretch; cursor: zoom-in;
  --r: 2.6cqh; padding: 4cqh 4cqh 0; animation: cardIn 1s var(--out) both; }
@keyframes cardIn { from { opacity: 0; transform: translate3d(4cqh, 0, 0) rotate(2deg); } to { opacity: 1; transform: none; } }
.qrcard .qr { width: 56cqh; height: 56cqh; align-self: center; }
.qrcard .perf { margin: 3.2cqh -4cqh 0; border-top-width: .32cqh; }
.qrcard .stub { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 2cqh; padding: 0 .4cqh; }
.qrcard .stub .eyebrow { color: var(--q1); font-size: 1.75cqh; }
.qrcard .stub .scan { font: 700 2.7cqh/1.1 var(--display); color: var(--paper-ink); }
.qrcard .stub .shape { width: 3.4cqh; height: 3.4cqh; color: var(--q2); }

/* Powiększony kod: scena na poziomie ekranu (nie w kafelku), klik albo Esc zamyka */
#zoom { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; gap: 7cqh; opacity: 0; pointer-events: none;
  background: color-mix(in srgb, var(--bg) 88%, transparent); transition: opacity .5s var(--out); cursor: zoom-out; }
#zoom.on { opacity: 1; pointer-events: auto; }
#zoom .ticket { --r: 3cqh; padding: 4cqh; transform: scale(.94); transition: transform .7s var(--spring); }
#zoom.on .ticket { transform: none; }
#zoom .qr { width: 80cqh; height: 80cqh; }
#zoom .side { display: flex; flex-direction: column; gap: 2cqh; }
#zoom .side .pinrow { margin: 0; }

/* ---------- Pytanie / odsłonięcie ---------- */
.fuse { position: absolute; left: 0; right: 0; top: 0; height: .9cqh; background: var(--hair); overflow: hidden; }
.fuse i { position: absolute; inset: 0; transform-origin: left center; background: linear-gradient(90deg, var(--p1), var(--p2)); }
.fuse.hot i { background: var(--bad); }
.qtop { position: absolute; left: 5cqw; right: 5cqw; top: 4.4cqh; display: flex; align-items: center; gap: 1.6cqh; }
.qtop .crest { width: 5.4cqh; height: 5.4cqh; }
.qtop .meta { flex: 1; display: flex; gap: 1.2cqh; align-items: center; flex-wrap: nowrap; min-width: 0; }
.qtop .qn { font: 700 2.2cqh/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--ink2); white-space: nowrap; }
.qtop .qn b { color: var(--ink); font-family: var(--display); font-size: 3.3cqh; letter-spacing: .02em; }
.clock { position: absolute; right: 5cqw; top: 3cqh; display: flex; flex-direction: column; align-items: flex-end; gap: .6cqh; }
.clock .sec { font: 700 9.2cqh/0.9 var(--display); min-width: 13cqh; text-align: right; transition: color .4s; }
.clock .sec.hot { color: var(--bad); }
.clock .sec.beat { animation: beat .5s var(--out); }
@keyframes beat { 30% { transform: scale(1.12); } 100% { transform: none; } }
.clock .ans { font: 650 1.85cqh/1 var(--sans); color: var(--ink2); white-space: nowrap; }
.clock .ans b { color: var(--ink); }
.meter { width: 22cqh; height: .8cqh; border-radius: 1cqh; background: var(--hair); overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--p1), var(--p2)); transform-origin: left; transform: scaleX(0); transition: transform .6s var(--out); }
.qbox { position: absolute; left: 5cqw; right: 5cqw; top: 15cqh; height: 30cqh; display: flex; align-items: center; }
.qbox p { margin: 0; font: 700 6cqh/1.18 var(--display); letter-spacing: -.005em; text-wrap: balance; }
.qbox .multi { position: absolute; left: 0; bottom: -3.4cqh; font: 700 1.7cqh/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--warn); }
.answers { position: absolute; left: 5cqw; right: 5cqw; top: 49cqh; bottom: 5cqh; display: grid; grid-template-columns: 1fr 1fr; gap: 1.8cqh; grid-auto-rows: 1fr; }
.answers.n2 { grid-template-rows: 1fr; } .answers.n5, .answers.n6 { grid-template-columns: 1fr 1fr 1fr; }
.ans-tile { position: relative; display: flex; align-items: center; gap: 2cqh; padding: 1.4cqh 2.4cqh 1.4cqh 1.4cqh; border-radius: 1.8cqh; overflow: hidden;
  background: var(--glass); border: 1px solid var(--hair); min-height: 0; animation: tileIn .7s var(--out) both; animation-delay: var(--d);
  transition: opacity .7s var(--out), transform .7s var(--out), border-color .5s, background-color .5s; }
@keyframes tileIn { from { opacity: 0; transform: translate3d(0, 3cqh, 0); } to { opacity: 1; transform: none; } }
.ans-tile .badge { flex: none; width: 8.4cqh; height: 8.4cqh; border-radius: 1.4cqh; display: flex; align-items: center; justify-content: center; background: var(--tc0); color: #fff; position: relative; }
.ans-tile .badge .shape { width: 4.6cqh; height: 4.6cqh; }
.ans-tile .badge .ltr { position: absolute; right: .6cqh; bottom: .3cqh; font: 800 1.5cqh/1 var(--sans); opacity: .85; }
.ans-tile .tx { position: relative; z-index: 1; flex: 1; min-width: 0; font: 600 3cqh/1.22 var(--sans); }
.ans-tile .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: left; transform: scaleX(0); background: color-mix(in srgb, var(--tc0) 22%, transparent);
  transition: transform 1.3s var(--out); transition-delay: var(--bd, 0s); }
.ans-tile .cnt { position: relative; z-index: 1; font: 700 4.2cqh/1 var(--display); opacity: 0; transition: opacity .6s var(--out); transition-delay: var(--bd, 0s); }
.ans-tile .tick { position: absolute; left: -1cqh; top: -1cqh; width: 4.4cqh; height: 4.4cqh; border-radius: 50%; background: var(--good); color: #062417;
  display: flex; align-items: center; justify-content: center; font: 900 2.8cqh/1 var(--sans); opacity: 0; transform: scale(2.2) rotate(-20deg); z-index: 2; }
.revealed .ans-tile, .answers.static .ans-tile { animation: none; }
.revealed .ans-tile.wrong { opacity: .34; transform: scale(.985); }
.revealed .ans-tile.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--glass)); }
.revealed .ans-tile .cnt { opacity: 1; }
.revealed .ans-tile.right .tick { animation: tickIn .6s var(--spring) both; animation-delay: var(--td, .3s); }
@keyframes tickIn { to { opacity: 1; transform: none; } }
.score-head { position: absolute; right: 5cqw; top: 3.2cqh; text-align: right; }
.score-head b { display: block; font: 700 7.4cqh/0.95 var(--display); color: var(--good); }
.score-head span { font: 650 1.85cqh/1.2 var(--sans); color: var(--ink2); }
.curio { --r: 1.6cqh; position: absolute; left: 5cqw; right: 5cqw; bottom: 3.4cqh; padding: 1.6cqh 2.6cqh; display: flex; gap: 2.2cqh; align-items: center;
  animation: rise .8s var(--out) both; animation-delay: 1.1s; }
.curio .eyebrow { color: var(--q1); font-size: 1.5cqh; flex: none; }
.curio p { margin: 0; font: 500 2.2cqh/1.35 var(--display); color: var(--paper-ink); max-height: 6.2cqh; overflow: hidden; }
.with-curio .answers { bottom: 15.5cqh; }

/* Pauza: zegar i lont stoją, odpowiedzi przygasają, znak pauzy zamiast liczby odpowiedzi */
.pausebadge { position: absolute; right: 5cqw; top: 15.5cqh; display: flex; align-items: center; gap: .9cqh; opacity: 0; transform: translateY(-1cqh);
  transition: opacity .4s var(--out), transform .5s var(--spring); }
.pausebadge i { width: 1.3cqh; height: 4.2cqh; border-radius: .4cqh; background: var(--warn); }
.pausebadge span { margin-left: 1cqh; font: 800 2cqh/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--warn); }
.scene.paused .pausebadge { opacity: 1; transform: none; }
.scene.paused .clock .sec { color: var(--warn); }
.scene.paused .answers, .scene.paused .qbox { opacity: .45; transition: opacity .5s var(--out); }
.qrcard .lockstamp { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .4s var(--out); }
.qrcard .lockstamp .stamp { font-size: 4cqh; background: var(--paper); }
.qrcard.locked .lockstamp { opacity: 1; }
.qrcard.locked .lockstamp .stamp { animation: slam .62s var(--spring) both; }
.qrcard.locked .qr { opacity: .18; transition: opacity .5s var(--out); }

/* ---------- Ranking i podium ---------- */
.board h2 { position: absolute; left: 5cqw; top: 13cqh; margin: 0; font: 700 5.4cqh/1 var(--display); }
.board .sub { position: absolute; left: 5cqw; top: 20.2cqh; font: 600 2cqh/1 var(--sans); color: var(--ink2); }
.podium { position: absolute; left: 5cqw; bottom: 5cqh; top: 26cqh; width: 96cqh; display: flex; align-items: flex-end; justify-content: center; gap: 2cqh; }
.board.solo .podium { left: 50%; transform: translateX(-50%); }
.step { width: 29cqh; display: flex; flex-direction: column; align-items: center; gap: 1.4cqh; }
.step .who { --r: 1cqh; max-width: 100%; padding: 1.2cqh 1.8cqh; text-align: center; animation: pop .7s var(--spring) both; animation-delay: var(--nd); }
.step .who b { display: block; font: 700 2.5cqh/1.15 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step .who span { font: 700 2.2cqh/1.2 var(--display); color: var(--q1); }
.step .block { width: 100%; height: var(--h); border-radius: 1.6cqh 1.6cqh 0 0; position: relative; transform-origin: bottom; animation: grow 1.1s var(--out) both; animation-delay: var(--bd);
  background: linear-gradient(180deg, color-mix(in srgb, var(--p1) 55%, var(--bg2)), color-mix(in srgb, var(--p2) 35%, var(--bg))); border: 1px solid var(--hair); border-bottom: 0;
  display: flex; justify-content: center; padding-top: 2cqh; }
.step.p1 .block { background: linear-gradient(180deg, #f2cf6b, #a5782a); }
.step .block .pl { font: 700 9cqh/1 var(--display); color: rgba(255, 255, 255, .92); }
.step.p1 .block .pl { color: #3b2a07; }
@keyframes grow { from { transform: scaleY(0); } to { transform: none; } }
.rest { position: absolute; right: 5cqw; top: 26cqh; bottom: 5cqh; width: 60cqh; display: flex; flex-direction: column; gap: 1.1cqh; overflow: hidden; }
.rrow { display: flex; align-items: center; gap: 1.6cqh; padding: 1.3cqh 2cqh; border-radius: 1.4cqh; background: var(--glass); border: 1px solid var(--hair);
  animation: rise .6s var(--out) both; animation-delay: var(--d); }
.rrow .pl { width: 4.2cqh; font: 700 2.8cqh/1 var(--display); color: var(--ink2); }
.rrow .nm { flex: 1; min-width: 0; font: 650 2.4cqh/1.1 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rrow .sc { font: 700 2.6cqh/1 var(--display); }
.interlude { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3cqh; text-align: center; }
.interlude h2 { margin: 0; font: 700 6cqh/1.1 var(--display); max-width: 120cqh; }
.interlude p { margin: 0; font: 500 2.4cqh/1.4 var(--sans); color: var(--ink2); }
.dots { display: flex; gap: 1cqh; }
.dots i { width: 1.4cqh; height: 1.4cqh; border-radius: 50%; background: var(--hair); }
.dots i.done { background: var(--p1); } .dots i.now { background: var(--ink); transform: scale(1.3); }

/* ---------- Koniec ---------- */
.end .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.6cqh; text-align: center; }
.end .crest.big { width: 16cqh; height: 16cqh; animation: pop 1s var(--spring) both; }
.end h1 { margin: 0; font: 700 8cqh/1.05 var(--display); max-width: 140cqh; }
.end .lead { font: 500 2.6cqh/1.4 var(--sans); color: var(--ink2); margin: 0; }
.ring { position: relative; width: 38cqh; height: 38cqh; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .in b { font: 700 10cqh/0.9 var(--display); }
.ring .in span { font: 650 2cqh/1.2 var(--sans); color: var(--ink2); }
.seal { position: absolute; right: 7cqw; bottom: 7cqh; width: 20cqh; height: 20cqh; color: color-mix(in srgb, var(--p1) 60%, var(--ink)); opacity: .8; }
.seal svg { width: 100%; height: 100%; }
.seal.slam { animation: sealIn .8s var(--spring) both; animation-delay: 1.4s; }
@keyframes sealIn { from { opacity: 0; transform: scale(1.8) rotate(-30deg); } to { opacity: .8; transform: rotate(-12deg); } }
.end.withboard .center { top: 0; bottom: auto; height: 26cqh; padding-top: 6cqh; }
.end.withboard h1 { font-size: 5.6cqh; }

/* ---------- Błąd / start ---------- */
.fatal { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4cqh; text-align: center; padding: 0 12cqw; }
.fatal h1 { margin: 0; font: 700 6cqh/1.1 var(--display); }
.fatal p { margin: 0; font: 500 2.4cqh/1.45 var(--sans); color: var(--ink2); }
.loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.loading .ticket { --r: 1.4cqh; width: 30cqh; height: 12cqh; animation: ghost 1.6s ease-in-out infinite; }
.foot { position: absolute; left: 5cqw; right: 5cqw; bottom: 2cqh; display: flex; justify-content: space-between; align-items: center; font: 600 1.6cqh/1 var(--sans);
  color: var(--ink3); letter-spacing: .12em; text-transform: uppercase; pointer-events: none; }
.foot .join b { color: var(--ink2); letter-spacing: .2em; }

/* Sterowanie poza sceną (chowa się po 2,5 s bez ruchu myszy) */
#ctl { position: fixed; top: 14px; right: 14px; z-index: 20; display: flex; gap: 8px; transition: opacity .4s var(--out); }
#ctl button { display: flex; align-items: center; gap: 8px; padding: 10px 15px; border-radius: 999px; cursor: pointer; font: 600 14px/1 var(--sans);
  color: #fff; background: rgba(20, 18, 16, .66); border: 1px solid rgba(255, 255, 255, .22); }
#ctl kbd { font: 700 11px/1 var(--sans); border: 1px solid rgba(255, 255, 255, .38); border-radius: 5px; padding: 2px 6px; opacity: .8; }
#start { position: fixed; left: 50%; bottom: 7vh; z-index: 20; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px;
  transition: opacity .6s var(--out), transform .6s var(--out); }
#start button { padding: 16px 30px; border-radius: 999px; border: 0; cursor: pointer; background: var(--paper); color: var(--paper-ink); font: 700 19px/1 var(--sans); }
#start span { font: 500 13px/1.3 var(--sans); color: var(--ink2); }
body.full #start, body.quiet #start, body.hush #start { opacity: 0; pointer-events: none; transform: translate(-50%, 12px); }
body.quiet { cursor: none; } body.quiet #ctl { opacity: 0; pointer-events: none; }
#conn { left: 14px; top: 14px; }
</style>
</head>
<body>
<div id="stage" aria-live="polite"><div class="scene on loading" id="boot"><div class="ticket"></div></div><div id="zoom" aria-hidden="true"></div></div>
<div id="ctl">
  <button id="themeBtn" type="button"><span id="themeTxt">Jasny</span><kbd>L</kbd></button>
  <button id="fullBtn" type="button"><span id="fullTxt">Pełny ekran</span><kbd>F</kbd></button>
</div>
<div id="start"><button id="startBtn" type="button">Pełny ekran</button><span id="startHint">albo F · ekran idzie za prowadzącym sam</span></div>
<div class="conn" id="conn"><i></i><span>Łączę ponownie…</span></div>
<script src="/exam-live/assets/live.js"></script>
<script src="/exam-live/assets/projector.js"></script>
</body>
</html>
